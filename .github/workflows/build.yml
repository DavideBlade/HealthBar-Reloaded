name: Build

on:
  push:
    branches: [master]
    # A change only to these files needs no build
    paths-ignore: ['**.md']
  pull_request:
  workflow_dispatch:

# A new push stops the run still going for the same branch or pull request
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The workflow only reads the repository: it publishes nothing
permissions:
  contents: read

jobs:
  build:
    name: Build and tests
    runs-on: ubuntu-latest
    outputs:
      class-version: ${{ steps.bytecode.outputs.class-version }}
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      - name: Build and run the tests
        run: ./mvnw -B -ntp verify

      - name: Find the Java version the jar needs
        id: bytecode
        run: python3 .github/scripts/class-version.py plugin/target/HealthBar-Reloaded.jar >> "$GITHUB_OUTPUT"

  # Supported Minecraft versions: the oldest one exactly, then the last release of every later major version. Kept in
  # one file so that every job uses the same list.
  versions:
    name: Supported versions
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.read.outputs.list }}
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the list
        id: read
        run: echo "list=$(jq -c . .github/supported-versions.json)" >> "$GITHUB_OUTPUT"

  # A method missing in an old API, or removed from a new one, is a compile error here
  api:
    name: Spigot API ${{ matrix.version }}
    needs: versions
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.versions.outputs.list) }}
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      - name: Compile against this API
        env:
          VERSION: ${{ matrix.version }}
        run: ./mvnw -B -ntp -Dspigot-api.version="$VERSION" compile

  # The jar must run on every Java that a supported server accepts, from Java 17 (the minimum the Spigot page states) up.
  # For each Minecraft version, BuildTools publishes the Java versions that server accepts, as class file versions
  # (60 = Java 16, 61 = Java 17, 65 = Java 21).
  java:
    name: Java of the supported servers
    needs: [versions, build]
    runs-on: ubuntu-latest
    steps:
      - name: Compare the jar with each server
        env:
          VERSIONS: ${{ needs.versions.outputs.list }}
          CLASS_VERSION: ${{ needs.build.outputs.class-version }}
          MIN_JAVA: 61 # Java 17
        run: |
          echo "| Server | Java it accepts | Runs the jar (Java $((CLASS_VERSION - 44))) on all of them, from Java $((MIN_JAVA - 44))? |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
          failed=0
          for version in $(echo "$VERSIONS" | jq -r '.[]'); do
            range=$(curl -fsSL "https://hub.spigotmc.org/versions/$version.json" | jq -r '.javaVersions | "\(.[0]) \(.[1])"')
            set -- $range
            # The oldest Java an owner of this server may use: the server's own minimum, but never below MIN_JAVA
            oldest=$(( $1 > MIN_JAVA ? $1 : MIN_JAVA ))
            runs=no
            if [ "$oldest" -gt "$2" ]; then
              echo "::error::Spigot $version runs only on Java $(($1 - 44)) to $(($2 - 44)), older than Java $((MIN_JAVA - 44))"
            elif [ "$CLASS_VERSION" -gt "$oldest" ]; then
              echo "::error::Spigot $version accepts Java $((oldest - 44)), the jar needs Java $((CLASS_VERSION - 44))"
            else
              runs=yes
            fi
            [ "$runs" = yes ] || failed=1
            echo "| $version | $(($1 - 44)) to $(($2 - 44)) | $runs |" >> "$GITHUB_STEP_SUMMARY"
          done
          exit $failed
